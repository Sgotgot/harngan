<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>หารกัน</title>
<meta name="theme-color" content="#0e1214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="หารกัน">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark hero with the balance (like a wallet), a light sheet sliding over it with the
   transaction list, and a floating dock (รายการ · + · ปฏิทิน). Forms open as bottom sheets. */
:root{
  --hero:#0e1214; --hero-2:#1a2226; --hero-fg:#f3f5f4; --hero-muted:#93a1a6; --hero-card:rgba(255,255,255,.07);
  --bg:#e9ebea; --sheet:#f7f8f7; --row:#ffffff; --line:#e3e6e4; --field:#ffffff; --field-line:#d3d8d5;
  --fg:#15191a; --muted:#6f7a7d; --accent:#22a06b; --accent-soft:#dff3e9;
  --minus:#d0453b; --minus-soft:#fbe9e7;
  --pa:#e5483e; --pa-soft:#fde9e7; --pa-hero:#ff8a80;
  --pb:#3366e0; --pb-soft:#e7edfc; --pb-hero:#8fb0ff;
  --dock:#15191a; --dock-fg:#c9d1d3;
  --f:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060808; --sheet:#121617; --row:#1a1f20; --line:#252b2c; --field:#0f1213; --field-line:#323a3b;
  --fg:#eef1f0; --muted:#8e9a9d; --accent:#3cc58a; --accent-soft:#16352a;
  --minus:#ff7a6c; --minus-soft:#3a1f1c; --pa:#ff7d73; --pa-soft:#3a1f1d; --pb:#86a6ff; --pb-soft:#1c2642;
  --dock:#262d2e; --dock-fg:#c9d1d3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060808; --sheet:#121617; --row:#1a1f20; --line:#252b2c; --field:#0f1213; --field-line:#323a3b;
  --fg:#eef1f0; --muted:#8e9a9d; --accent:#3cc58a; --accent-soft:#16352a;
  --minus:#ff7a6c; --minus-soft:#3a1f1c; --pa:#ff7d73; --pa-soft:#3a1f1d; --pb:#86a6ff; --pb-soft:#1c2642;
  --dock:#262d2e; --dock-fg:#c9d1d3; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--hero)}
body{-webkit-text-size-adjust:100%;color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.p-a{color:var(--pa);font-weight:600}.p-b{color:var(--pb);font-weight:600}
svg.ic{width:22px;height:22px;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--sheet);position:relative}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;color:var(--hero-fg);
  background:radial-gradient(120% 80% at 100% 0%,#24343a 0%,transparent 55%),linear-gradient(180deg,var(--hero-2),var(--hero) 70%);
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px))}
.hero .p-a{color:var(--pa-hero)}.hero .p-b{color:var(--pb-hero)}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.avatars{display:flex}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1rem;color:#fff;border:2px solid var(--hero)}
.av-a{background:var(--pa)}.av-b{background:var(--pb);margin-left:-10px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--hero-card);color:var(--hero-fg);display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.hero-actions{display:flex;gap:8px}
.stripes{position:absolute;right:-6px;top:96px;display:flex;gap:0;z-index:0}
.stripes i{display:block;width:26px;height:150px;border-radius:14px 0 0 14px;margin-left:-12px;box-shadow:-4px 0 10px rgba(0,0,0,.25)}
.stripes .s1{background:var(--pa);height:150px}.stripes .s2{background:var(--accent);height:150px}.stripes .s3{background:var(--pb);height:150px}
.hlabel{display:block;color:var(--hero-muted);font-size:.9rem;margin-top:26px;position:relative;z-index:1}
.big{font-size:3rem;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-top:2px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.big .cur{font-weight:600;margin-right:4px}
.big small{font-size:1.4rem;font-weight:500;color:var(--hero-muted)}
.owe{margin:6px 0 0;font-size:1rem;position:relative;z-index:1;max-width:78%}
.pills{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.pill{border:none;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.pill.light{background:#fff;color:#111}
.pill.dark{background:var(--hero-card);color:var(--hero-fg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pill svg.ic{width:20px;height:20px}
.pill.light .dotic{width:22px;height:22px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center}
.pill.light .dotic svg{width:14px;height:14px}
.spend{margin-top:22px;background:var(--hero-card);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.spend .lbl{color:var(--hero-muted);font-size:.85rem}
.spend b{display:block;font-size:1.3rem;font-weight:600}
.spend-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.85rem;color:var(--hero-muted)}
.spend-r b{display:inline;font-size:.95rem;color:var(--hero-fg);font-weight:600;margin-left:4px}

/* ---- sheet ---- */
.sheet{position:relative;margin-top:-28px;background:var(--sheet);border-radius:28px 28px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));min-height:50vh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px 10px}
.sheet-head h2{margin:0;font-size:1.15rem;font-weight:600;flex:1;text-align:center}
.sheet-head .side{width:40px;height:40px}
.banner{font-size:.85rem;padding:10px 12px;border-radius:12px;background:var(--minus-soft);color:var(--minus);margin-bottom:10px}
.banner.info{background:var(--line);color:var(--muted)}
.day{margin-bottom:14px}
.dayhead{display:flex;justify-content:space-between;padding:4px 6px 6px;font-size:.85rem;color:var(--muted);font-weight:500}
.rows{background:var(--row);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.tx{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);padding:12px 14px;min-height:64px}
.tx:first-child{border-top:none}
.tx:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.txi{position:relative;width:44px;height:44px;border-radius:50%;background:#161b1d;color:#fff;display:grid;place-items:center}
.txi svg{width:22px;height:22px}
.txi.ok{background:var(--accent)}
.pd{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--row)}
.pd-a{background:var(--pa)}.pd-b{background:var(--pb)}
.txt{min-width:0}
.txt b{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.txt small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.txa{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.txa.ok{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .bigic{width:56px;height:56px;border-radius:50%;background:var(--row);border:1px solid var(--line);display:grid;place-items:center}
.more{display:block;margin:4px auto 0;border:1px solid var(--line);background:var(--row);border-radius:999px;padding:8px 18px;min-height:40px;color:var(--muted)}

/* calendar */
.calcard{background:var(--row);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:16px}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head h3{margin:0;font-size:1rem;font-weight:600}
.navbtn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;font-size:1.3rem;color:var(--muted)}
.navbtn:hover{background:var(--line)}
.navbtn:disabled{opacity:.3}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:6px}
.wd{font-size:.75rem;color:var(--muted);padding-bottom:4px}
.cd{position:relative;border:none;background:transparent;border-radius:50%;aspect-ratio:1;max-width:44px;width:100%;justify-self:center;font-size:.9rem;font-variant-numeric:tabular-nums;padding:0}
.cd:hover{background:var(--line)}
.cd.out{visibility:hidden}
.cd.future{opacity:.3}
.cd.today{font-weight:700;box-shadow:inset 0 0 0 1.5px var(--field-line)}
.cd.sel{background:var(--fg);color:var(--sheet)}
.cd .d{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%}
.cd .d.spent{background:var(--muted);opacity:.6}
.cd.sel .d.spent{background:var(--sheet)}
.cd .d.paid{background:var(--accent);width:8px;height:8px;bottom:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cal-foot{font-size:.85rem;color:var(--muted);margin-top:4px}
.cal-foot b{color:var(--fg)}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;align-items:center;gap:6px;background:var(--dock);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dock button{border:none;background:transparent;color:var(--dock-fg);width:56px;height:48px;border-radius:999px;display:grid;place-items:center}
.dock button[aria-pressed=true]{color:#fff;background:rgba(255,255,255,.12)}
.dock .dock-add{width:84px;background:#fff;color:#111}
.dock .dock-add:hover{background:#f0f0f0}

/* bottom-sheet modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,8,9,.55);display:flex;align-items:flex-end;justify-content:center}
.msheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--sheet);border-radius:26px 26px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.msheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead h2{margin:0;font-size:1.2rem;font-weight:600}
.x{width:40px;height:40px;border-radius:50%;border:none;background:var(--line);display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.hint{margin:0;font-size:.82rem;color:var(--muted)}
input[type=text],input[type=number]{background:var(--field);border:1px solid var(--field-line);border-radius:14px;padding:10px 14px;min-height:50px;width:100%;min-width:0;font-size:1rem}
input:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 12%,transparent)}
input::placeholder{color:var(--muted);opacity:.8}
.price{text-align:right;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 124px;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--line);padding:4px;border-radius:16px}
.seg button{border:none;background:transparent;border-radius:12px;min-height:44px;padding:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.92rem;line-height:1.2;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--row);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .who-a[aria-pressed=true]{color:var(--pa)}.seg .who-b[aria-pressed=true]{color:var(--pb)}
.seg svg{width:18px;height:18px}
.pdot{width:10px;height:10px;border-radius:50%}
.who-a .pdot{background:var(--pa)}.who-b .pdot{background:var(--pb)}
.datebar{display:flex;align-items:center;background:var(--line);border-radius:16px;padding:4px}
.datebar span{flex:1;text-align:center;font-weight:600}
.datebar button{width:44px;height:44px;border:none;border-radius:12px;background:transparent;font-size:1.3rem}
.datebar button:hover{background:var(--row)}
.datebar button:disabled{opacity:.3}
.err{color:var(--minus);font-size:.88rem}
.err:empty{display:none}
.btn{border:none;border-radius:999px;min-height:54px;font-size:1.05rem;font-weight:600;padding:12px 18px;width:100%}
.btn.main{background:var(--fg);color:var(--sheet)}
.btn.go{background:var(--accent);color:#fff}
.btn.soft{background:var(--line);color:var(--fg)}
.btn.danger{background:var(--minus-soft);color:var(--minus)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.share code{display:block;padding:12px 14px;background:var(--row);border:1px solid var(--line);border-radius:14px;overflow-wrap:anywhere;user-select:all;font-family:inherit;font-size:.88rem}
.settle-box{background:var(--row);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}
.settle-box .amt{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--sheet);padding:10px 18px;border-radius:999px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.warn{background:var(--minus);color:#fff}

@media (max-width:360px){.big{font-size:2.5rem}.row2{grid-template-columns:1fr 104px}.seg button{font-size:.84rem}}
@media (min-width:520px){.app{border-radius:0;box-shadow:0 0 0 1px rgba(255,255,255,.04)}body{background:#050707}}
</style>
<script>window.API_URL="https://script.google.com/macros/s/AKfycbxr-5VZnaQwFfz0EXe-smtkN0_zaZG1hd2Jrit-u_xkAoGU47jtQIA0xcTpfMP8bUHMYQ/exec";</script>
</head>
<body>
<div class="app">
  <header class="hero" id="hero"><div class="hero-top"><div class="avatars"></div></div><span class="hlabel">กำลังโหลด…</span></header>
  <main class="sheet" id="sheet"><div class="grab"></div><div id="banner" class="banner" hidden></div><div id="view"></div></main>
  <nav class="dock" id="dock" aria-label="เมนู" hidden>
    <button data-view="home" aria-pressed="true" aria-label="รายการ"></button>
    <button class="dock-add" data-open="add" aria-label="เพิ่มรายจ่าย"></button>
    <button data-view="cal" aria-pressed="false" aria-label="ปฏิทิน"></button>
  </nav>
</div>
<div class="scrim" id="scrim" hidden><div class="msheet" role="dialog" aria-modal="true" id="msheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const baht=s=>{const v=Math.abs(s)/100;return "฿"+v.toLocaleString("th-TH",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
const toSat=v=>Math.round(parseFloat(v)*100);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const shift=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const MAX=100000000; // ฿1,000,000

const MEALS=[["morning","เช้า"],["noon","เที่ยง"],["evening","เย็น"],["other","อื่นๆ"]];
const PICK=MEALS.slice(0,3);
const mealKey=m=>MEALS.some(x=>x[0]===m)?m:"other";
const mealName=k=>MEALS.find(m=>m[0]===mealKey(k))[1];
const nowMeal=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?"morning":h<15.5?"noon":"evening"};
const PATHS={
  morning:'<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 4v4M4.9 9.9l1.4 1.4M19.1 9.9l-1.4 1.4M1 14h2M21 14h2"/>',
  noon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  evening:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  other:'<path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const icon=(k,cls="ic")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[k]||PATHS.other}</svg>`;
function dayLabel(s){
  const d=new Date(s+"T00:00:00"),long=d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
  return s===today()?"วันนี้ · "+long:s===shift(today(),-1)?"เมื่อวาน · "+long:long;
}

/* ---------- storage ---------- */
function localStore(){
  let data={config:null,entries:{}};
  try{data=JSON.parse(ls.get("harngan2"))||data}catch(e){}
  let cf=null,ef=null;
  const save=()=>{ls.set("harngan2",JSON.stringify(data));cf&&cf(data.config);ef&&ef(arr())};
  const arr=()=>Object.entries(data.entries).map(([id,e])=>({id,...e}));
  return{shared:false,
    onConfig(f){cf=f;f(data.config)},onEntries(f){ef=f;f(arr())},
    async setConfig(c){data.config=c;save()},
    async add(e){data.entries[uid()]=e;save()},
    async put(id,e){data.entries[id]=e;save()},
    async del(id){delete data.entries[id];save()}};
}
/* Google Sheet backend (Apps Script JSON API). The page keeps its own copy, changes show at once,
   the Sheet is written in the background and re-read every 15 s so the other phone's entries arrive. */
function sheetStore(url){
  const call=(fn,...args)=>fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})})
    .then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.error);return r.data});
  let data={config:undefined,entries:[]},cf=null,ef=null,pending=0;
  const emit=()=>{cf&&cf(data.config);ef&&ef(data.entries.slice())};
  const apply=d=>{data={config:d.config,entries:d.entries||[]};emit()};
  const refresh=()=>{if(pending)return;call("getAll").then(d=>{if(!pending)apply(d)}).catch(()=>{})};
  const send=(fn,args,local)=>{
    local();emit();pending++;
    call(fn,...args).then(d=>{pending--;if(!pending)apply(d)})
      .catch(()=>{pending--;toast("บันทึกลง Google Sheet ไม่สำเร็จ ตรวจเน็ตแล้วลองอีกครั้ง",true);refresh()});
    return Promise.resolve();
  };
  const load=n=>call("getAll").then(d=>{banner("");apply(d)}).catch(()=>{if(n<2)setTimeout(()=>load(n+1),1500);else banner("โหลดข้อมูลจาก Google Sheet ไม่ได้ ตรวจเน็ตแล้วรีโหลดหน้า")});
  load(0);
  setInterval(()=>{if(!document.hidden)refresh()},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
  return{shared:true,
    onConfig(f){cf=f;if(data.config!==undefined)f(data.config)},
    onEntries(f){ef=f},
    setConfig:c=>send("setConfig",[c],()=>{data.config=c}),
    add:e=>{const id=uid();return send("addEntry",[id,e],()=>{data.entries.push({id,...e})})},
    put:(id,e)=>send("putEntry",[id,e],()=>{data.entries=data.entries.map(x=>x.id===id?{id,...e}:x)}),
    del:id=>send("deleteEntry",[id],()=>{data.entries=data.entries.filter(x=>x.id!==id)})};
}

function banner(msg,info){const b=$("#banner");b.hidden=!msg;b.textContent=msg||"";b.className="banner"+(info?" info":"")}
async function write(fn){try{await fn();return true}catch(e){toast("บันทึกไม่สำเร็จ ลองอีกครั้ง",true);return false}}

/* how much b owes a (negative = a owes b), in satang */
function owedToA(entries){
  let n=0;
  for(const e of entries){
    const x=e.kind==="settle"?e.amount:e.split==="other"?e.amount:e.split==="custom"?(e.otherShare||0):Math.round(e.amount/2);
    n+=e.paidBy==="a"?x:-x;
  }
  return n;
}
const byDate=d=>S.entries.filter(e=>e.date===d);
const expTotal=list=>list.filter(e=>e.kind!=="settle").reduce((a,e)=>a+e.amount,0);
const order=e=>e.kind==="settle"?9:MEALS.findIndex(m=>m[0]===mealKey(e.meal));
const sortDay=list=>list.slice().sort((a,b)=>order(a)-order(b)||(a.createdAt||0)-(b.createdAt||0));

function calHTML(){
  const [y,mo]=S.calMonth.split("-").map(Number);
  const first=new Date(y,mo-1,1),daysIn=new Date(y,mo,0).getDate(),lead=first.getDay(),t=today();
  const spent=new Set(),paid={};
  S.entries.forEach(e=>{if(!String(e.date).startsWith(S.calMonth))return;if(e.kind==="settle")paid[e.date]=(paid[e.date]||0)+e.amount;else spent.add(e.date)});
  let cells="";
  for(let i=0;i<lead;i++)cells+=`<span class="cd out"></span>`;
  for(let d=1;d<=daysIn;d++){
    const ds=S.calMonth+"-"+String(d).padStart(2,"0"),fut=ds>t;
    const cls=["cd",fut?"future":"",ds===t?"today":"",ds===S.calDay?"sel":""].join(" ");
    const dot=paid[ds]?`<span class="d paid"></span>`:spent.has(ds)?`<span class="d spent"></span>`:"";
    cells+=`<button class="${cls}" data-cal="${ds}"${fut?" disabled":""} aria-label="${d}${paid[ds]?" เคลียร์แล้ว "+baht(paid[ds]):spent.has(ds)?" มีรายจ่าย":""}">${d}${dot}</button>`;
  }
  const pd=Object.keys(paid),cur=S.calMonth===t.slice(0,7)?"เดือนนี้":"เดือนนั้น";
  return `<div class="calcard">
    <div class="cal-head"><button class="navbtn" id="calPrev" aria-label="เดือนก่อน">‹</button><h3>${esc(first.toLocaleDateString("th-TH",{month:"long",year:"numeric"}))}</h3><button class="navbtn" id="calNext" aria-label="เดือนถัดไป"${S.calMonth>=t.slice(0,7)?" disabled":""}>›</button></div>
    <div class="cal-grid">${["อา","จ","อ","พ","พฤ","ศ","ส"].map(w=>`<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>วันที่เคลียร์เงินแล้ว</span><span><i style="background:var(--muted);opacity:.6"></i>มีรายจ่าย</span></div>
    <div class="cal-foot">${pd.length?`${cur}เคลียร์ <b>${pd.length} ครั้ง</b> รวม <b class="num">${baht(pd.reduce((a,d)=>a+paid[d],0))}</b>`:`${cur}ยังไม่ได้เคลียร์`}</div>
  </div>`;
}

    if(e.kind==="settle"){S.modal="settleEdit";S.form={id:e.id,confirm:false}}
    else S.form={mode:"edit",id:e.id,date:e.date,meal:mealKey(e.meal)==="other"?"other":e.meal,title:e.title||"",price:String(e.amount/100),paid:e.paidBy,split:e.split||"half",share:e.split==="custom"?String((e.otherShare||0)/100):"",err:"",confirm:false}}

      ${S.form.confirm?`<p class="hint" style="text-align:center">ลบแล้วยอดค้างจะกลับมาเหมือนก่อนเคลียร์</p><div class="btnrow"><button class="btn soft" data-close>ไม่ลบ</button><button class="btn danger" id="sdelYes">ลบเลย</button></div>`:`<button class="btn danger" id="sdel">ลบรายการนี้</button>`}`}

async function saveForm(){
  const f=S.form,err=m=>{f.err=m;$("#fErr").textContent=m};
  const amt=toSat(f.price);
  if(!(amt>0)||amt>MAX)return err(f.price===""?"ใส่ราคาก่อน":"ราคาต้องมากกว่า 0 และไม่เกิน ฿1,000,000");
  const base=f.mode==="edit"?{...S.entries.find(x=>x.id===f.id)}:{kind:"expense",createdAt:Date.now()};
  delete base.id;delete base.otherShare;
  const e={...base,kind:"expense",date:f.date,meal:f.meal,title:f.title.trim(),amount:amt,paidBy:f.paid,split:f.split};
  if(f.split==="custom"){const ot=toSat(f.share);if(!(ot>=0)||ot>amt)return err(`ใส่ส่วนของ${nm(other(f.paid))} (ไม่เกิน ${baht(amt)})`);e.otherShare=ot}
  ls.set("harngan-paid",f.paid);
  const ok=await write(()=>f.mode==="edit"?S.store.put(f.id,e):S.store.add(e));
  if(ok){const wasEdit=f.mode==="edit";S.view==="cal"&&(S.calDay=e.date);closeModal();toast(wasEdit?"แก้ไขแล้ว":"บันทึกแล้ว")}
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const f=S.form;if(!f)return;
  if(e.target.id==="fTitle")f.title=e.target.value;else if(e.target.id==="fPrice")f.price=e.target.value;else if(e.target.id==="fShare")f.share=e.target.value;
  if(f.err){f.err="";const x=$("#fErr");if(x)x.textContent=""}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.modal){closeModal();return}
  if(e.key!=="Enter")return;
  if(e.target.id==="fTitle"){e.preventDefault();$("#fPrice").focus();return}
  if(e.target.id==="fPrice"||e.target.id==="fShare"){e.preventDefault();saveForm();return}
  if(e.target.id==="n1"||e.target.id==="n2"){e.preventDefault();$("#nSave").click()}
});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const f=S.form;
  if(b.hasAttribute("data-close")){closeModal();return}
  if(b.dataset.open){openModal(b.dataset.open);return}
  if(b.dataset.view){S.view=b.dataset.view;renderDock();renderView();scrollTo({top:S.view==="cal"?$("#sheet").offsetTop-20:0,behavior:"smooth"});return}
  if(b.dataset.tx){openModal("edit",b.dataset.tx);return}
  if(b.dataset.cal){S.calDay=b.dataset.cal;renderView();return}
  if(b.id==="calPrev"||b.id==="calNext"){const [y,m]=S.calMonth.split("-").map(Number);S.calMonth=ymd(new Date(y,m-1+(b.id==="calNext"?1:-1),1)).slice(0,7);renderView();return}
  if(b.id==="moreBtn"){S.days+=10;renderView();return}
  if(f&&b.dataset.fdate){const d=shift(f.date,+b.dataset.fdate);if(d<=today()){f.date=d;renderModal()}return}
  if(f&&b.dataset.fmeal){f.meal=b.dataset.fmeal;renderModal();return}
  if(f&&b.dataset.fpaid){f.paid=b.dataset.fpaid;f.err="";renderModal();return}
  if(f&&b.dataset.fsplit){f.split=b.dataset.fsplit;f.err="";renderModal();if(f.split==="custom")$("#fShare")?.focus();return}
  if(b.id==="fSave"){b.disabled=true;await saveForm();if(document.body.contains(b))b.disabled=false;return}
  if(b.id==="fDel"){f.confirm=true;renderModal();return}
  if(b.id==="fDelNo"){f.confirm=false;renderModal();return}
  if(b.id==="fDelYes"){const id=f.id;if(await write(()=>S.store.del(id))){closeModal();toast("ลบแล้ว")}return}
  if(b.id==="sdel"){f.confirm=true;renderModal();return}
  if(b.id==="sdelYes"){const id=f.id;if(await write(()=>S.store.del(id))){closeModal();toast("ลบการเคลียร์ยอดแล้ว")}return}
  if(b.id==="settleYes"){const n=owedToA(S.entries);if(!n){closeModal();return}
    if(await write(()=>S.store.add({kind:"settle",date:today(),amount:Math.abs(n),paidBy:n>0?"b":"a",createdAt:Date.now()}))){closeModal();toast("เคลียร์ยอดแล้ว")}return}
  if(b.id==="nSave"){
    const a=$("#n1").value.trim(),c=$("#n2").value.trim(),er=$("#nErr");
    if(!a||!c){er.textContent="ใส่ชื่อให้ครบทั้งสองคน";return}
    if(a===c){er.textContent="สองคนต้องใช้ชื่อต่างกัน";return}
    if(await write(()=>S.store.setConfig({names:{a,b:c}}))){S.config=S.config||{names:{a,b:c}};closeModal()}return;
  }
  if(b.id==="copyLink"){
    const url=location.origin+location.pathname;
    try{await navigator.clipboard.writeText(url);toast("คัดลอกลิงก์แล้ว")}
    catch(err){const r=document.createRange();r.selectNodeContents($("#shareUrl"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("เลือกลิงก์ไว้แล้ว กดคัดลอกได้เลย")}
    return;
  }
});

/* ---------- boot ---------- */
function start(store){
  S.store=store;S.shared=store.shared;
  if(!store.shared)banner("โหมดเครื่องนี้: ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น อีกคนจะไม่เห็น",true);
  let day=today();
  const tick=()=>{const t=today();if(t===day)return;if(S.calDay===day)S.calDay=t;day=t;render()};
  setInterval(tick,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
  store.onConfig(c=>{const changed=JSON.stringify(c)!==JSON.stringify(S.config);S.config=c;if(changed)render()});
  store.onEntries(list=>{
    S.entries=list.filter(e=>e&&e.date&&e.amount>0);
    if(S.config===undefined)return;
    renderHero();renderView();
    if((S.modal==="settleEdit"||S.modal==="edit")&&S.form&&!S.entries.some(x=>x.id===S.form.id))closeModal();
  });
}
start(window.API_URL?sheetStore(window.API_URL):localStore());
})();
</script>
